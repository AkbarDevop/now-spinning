<div id="matrix-style-lab">
  <div class="viz-row" style="justify-content:space-between;margin-bottom:16px">
    <span>64 × 64 · Style lab</span><span class="text-small text-muted">Preview only</span>
  </div>
  <div class="presets" aria-label="Display styles"></div>
  <hr>
  <div class="workbench">
    <div class="display-column">
      <div class="matrix" role="img" aria-label="Animated 64 by 64 LED display preview"><canvas id="mx-main" width="64" height="64"></canvas><div class="led-grid" aria-hidden="true"></div></div>
      <div class="viz-row" style="justify-content:center;margin-top:14px">
        <button class="btn" id="mx-play" type="button">Pause</button>
        <button class="btn" id="mx-next" type="button">Change cover</button>
      </div>
      <div class="text-small text-muted" id="mx-description" aria-live="polite" style="margin-top:12px;text-align:center"></div>
      <label class="form-check" style="margin-top:12px"><input class="form-check-input" id="mx-dots" type="checkbox" checked><span class="form-check-label">LED grid</span></label>
    </div>
    <div>
      <div class="viz-controls">
        <label class="form-label">Cover shape<select class="form-select" data-setting="shape"><option value="circle">Circular record</option><option value="square">Square album</option></select></label>
        <label class="form-label">Border<select class="form-select" data-setting="border"><option value="none">None</option><option value="halo">Color halo</option><option value="progress">Progress ring</option><option value="chase">Moving light</option><option value="party">Party lights</option></select></label>
        <label class="form-label">Rotation <output id="mx-rpm">6.9 RPM</output><input class="form-range" data-setting="rpm" type="range" min="0" max="15" step="0.5" value="7"></label>
        <label class="form-label">Vinyl rim <output id="mx-rim">3 px</output><input class="form-range" data-setting="rim" type="range" min="0" max="7" step="1" value="3"></label>
        <label class="form-label">Border intensity <output id="mx-halo">65%</output><input class="form-range" data-setting="halo" type="range" min="10" max="100" step="5" value="65"></label>
        <label class="form-label">Color<select class="form-select" data-setting="palette"><option value="auto">From artwork</option><option value="amber">Warm amber</option><option value="ice">Ice blue</option><option value="pink">Soft pink</option><option value="mint">Mint</option></select></label>
        <label class="form-label">Footer<select class="form-select" data-setting="footer"><option value="name">Your name</option><option value="title">Scrolling title</option><option value="none">No text</option></select></label>
        <label class="form-label">Your name<input class="form-control" data-setting="name" value="AKBAR" maxlength="10" aria-label="Name on display"></label>
      </div>
      <div class="viz-row" style="margin-top:12px">
        <label class="form-check"><input class="form-check-input" data-setting="arm" type="checkbox" checked><span class="form-check-label">Tonearm</span></label>
        <label class="form-check"><input class="form-check-input" data-setting="spindle" type="checkbox" checked><span class="form-check-label">Center pin</span></label>
      </div>
      <label class="form-label" id="mx-progress-control" hidden style="margin-top:12px">Demo progress <output id="mx-progress-value">38%</output><input class="form-range" id="mx-progress" type="range" min="0" max="100" value="38"></label>
      <div class="viz-controls" style="margin-top:16px">
        <label class="form-label">Preview artwork<select class="form-select" id="mx-art"><option value="0">Fiesta · saved cover</option><option value="1">Sunset · demo artwork</option><option value="2">Blue hour · demo artwork</option></select></label>
      </div>
    </div>
  </div>
  <hr>
  <div class="viz-row" style="justify-content:space-between">
    <span id="mx-selected" aria-live="polite">Mini turntable</span>
    <button class="btn btn-primary" id="mx-choose" type="button">Choose this design</button>
  </div>
  <div id="mx-result" class="text-small" aria-live="polite" style="margin-top:10px"></div>
</div>
<style>
#matrix-style-lab .presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
#matrix-style-lab .preset{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
#matrix-style-lab .preset canvas{display:block;width:100%;max-width:136px;aspect-ratio:1;image-rendering:pixelated;cursor:pointer}
#matrix-style-lab .workbench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
#matrix-style-lab .display-column{min-width:0}
#matrix-style-lab .matrix{position:relative;width:100%;max-width:352px;aspect-ratio:1;margin:0 auto;background:#000}
#matrix-style-lab #mx-main{display:block;width:100%;height:100%;image-rendering:pixelated}
#matrix-style-lab .led-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,transparent 79%,#0009 80%),linear-gradient(to bottom,transparent 79%,#0009 80%);background-size:calc(100% / 64) calc(100% / 64)}
#matrix-style-lab output{float:right}
#matrix-style-lab #mx-result{overflow-wrap:anywhere}
#matrix-style-lab [hidden]{display:none!important}
@media(max-width:560px){#matrix-style-lab .workbench{grid-template-columns:1fr}#matrix-style-lab .presets{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
